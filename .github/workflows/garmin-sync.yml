name: Daily Garmin Sync

on:
  schedule:
    - cron: '0 4 * * *'   # 4 AM UTC — after Garmin devices have synced overnight
  workflow_dispatch:
    inputs:
      sync_days:
        description: 'Days back to sync (default 2, use 1825 for full 5-year backfill)'
        required: false
        default: '14'

jobs:
  sync:
    name: Sync Garmin data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garmin-fitness-app/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r garmin-fitness-app/scripts/requirements.txt

      - name: Run sync
        env:
          GARMIN_TOKENS:        ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
          APP_URL:              ${{ secrets.APP_URL }}
          SYNC_SECRET:          ${{ secrets.SYNC_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          SYNC_DAYS:            ${{ github.event.inputs.sync_days || '2' }}
        # NOTE: the real, actively-developed sync script lives under
        # garmin-fitness-app/scripts/ (the app's own subtree) — there's also a
        # stale standalone copy at the repo-root scripts/ which lacks the
        # per-second HR/power/cadence sample-sync feature entirely. Running
        # that stale copy was why per-second data never landed even though
        # "the sync ran successfully".
        run: python garmin-fitness-app/scripts/garmin_sync.py
