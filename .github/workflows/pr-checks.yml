name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garmin-fitness-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: garmin-fitness-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # One gate, same script the developer runs locally: typecheck, tests,
      # production build, dependency audit, secret scan, XSS-sink check.
      # Keeping CI and local identical means a green local run means something.
      - name: Verify (typecheck, tests, build, security)
        run: npm run verify
