name: Regenerate Garmin Tokens

# Manually-triggered token refresh — use this whenever the daily sync starts
# failing with an authentication error.
#
# How to use:
#   1. Open your Garmin authenticator app to read the current 6-digit code
#   2. Click "Run workflow" below, paste the code, click the green button
#   3. When the run finishes (~30 s), open it and scroll to the "Summary"
#      page — it shows the new base64 token blob and a link to the secret
#   4. Paste the blob into the GARMIN_TOKENS repo secret → Update

on:
  workflow_dispatch:
    inputs:
      mfa_code:
        description: '6-digit MFA code from your Garmin authenticator app'
        required: true
        type: string

jobs:
  regenerate:
    name: Generate new tokens
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate tokens
        env:
          GARMIN_EMAIL:    ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_MFA:      ${{ github.event.inputs.mfa_code }}
        run: python scripts/garmin_regenerate_tokens.py
