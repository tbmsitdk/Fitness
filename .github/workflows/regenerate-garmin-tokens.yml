name: Regenerate Garmin Tokens

# Browser-only token refresh — no terminal needed, SMS 2FA supported.
#
# How to use:
#   1. Click "Run workflow" below (no inputs needed — just click the green button)
#   2. Within ~5 s, Garmin will text you the SMS code
#   3. On your phone (or any browser): open  <APP_URL>/garmin-setup
#      and paste the SMS code. Tap "Submit".
#   4. The workflow picks up the code automatically and finishes in a few seconds
#   5. Open the completed run → "Summary" tab — it has the new token blob and
#      a one-click link to the GARMIN_TOKENS secret
#   6. Paste the blob into the secret. Done.

on:
  workflow_dispatch:

jobs:
  regenerate:
    name: Generate new tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate tokens
        env:
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
          APP_URL:              ${{ secrets.APP_URL }}
          SYNC_SECRET:          ${{ secrets.SYNC_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: python scripts/garmin_regenerate_tokens.py
