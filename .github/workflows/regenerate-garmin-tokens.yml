name: Regenerate Garmin Tokens

# Browser-only token refresh — no terminal needed, SMS 2FA supported.
#
# How to use:
#   1. Click "Run workflow" below (no inputs needed — just click the green button)
#   2. Within ~5 s, Garmin will text you the SMS code
#   3. On your phone (or any browser): open  <APP_URL>/garmin-setup
#      and paste the SMS code. Tap "Submit".
#   4. The workflow picks up the code and finishes in a few seconds. It stores the
#      new tokens in the app's database, where the daily sync loads them from.
#      Nothing needs pasting into a secret. Then run "Daily Garmin Sync".
#
#   Only if the app cannot be reached does the run fall back to the old manual
#   step (new token blob in the run's Summary tab, to paste into GARMIN_TOKENS)
#   and end in failure, so it cannot be mistaken for a finished job.

on:
  workflow_dispatch:

jobs:
  regenerate:
    name: Generate new tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garmin-fitness-app/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r garmin-fitness-app/scripts/requirements.txt

      - name: Generate tokens
        env:
          GARMIN_EMAIL:         ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD:      ${{ secrets.GARMIN_PASSWORD }}
          APP_URL:              ${{ secrets.APP_URL }}
          SYNC_SECRET:          ${{ secrets.SYNC_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: python garmin-fitness-app/scripts/garmin_regenerate_tokens.py
